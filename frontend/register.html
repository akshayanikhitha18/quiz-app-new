<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · QuizSphere</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head>
<body data-page="register"><div class="auth-wrap"><div class="auth-card"><a class="brand" href="index.html"><span class="logo">Q</span>QuizSphere</a><h1>Create your account</h1><p class="sub">Start practising in minutes.</p>
<form id="form" novalidate><div id="msg" aria-live="polite"></div><div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name"><small class="err" data-err="full_name"></small></div><div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username"><small class="err" data-err="username"></small></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><small class="err" data-err="email"></small></div><div class="field"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" autocomplete="new-password"><button type="button" aria-pressed="false">Show</button></div><small class="err" data-err="password"></small></div><div class="field"><label for="confirm_password">Confirm password</label><div class="pw"><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password"><button type="button" aria-pressed="false">Show</button></div><small class="err" data-err="confirm_password"></small></div><button class="btn" type="submit">Create account</button></form><p class="auth-foot">Already registered? <a href="login.html">Log in</a></p></div></div>
<script src="js/api.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
